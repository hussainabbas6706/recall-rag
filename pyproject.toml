[project]
name = "recall-rag"
version = "0.1.0"
description = "A local, grounded RAG assistant for Obsidian Markdown vaults."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain>=0.3,<2.0",
    "langchain-google-genai>=2.0,<4.0",
    "langchain-qdrant>=0.2,<2.0",
    "langchain-text-splitters>=0.3,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-frontmatter>=1.1,<2.0",
    "qdrant-client>=1.12,<2.0",
    "sentence-transformers>=6.2.0",
    "typer>=0.15,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
